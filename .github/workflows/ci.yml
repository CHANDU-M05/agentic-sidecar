name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # No [tool.uv.sources] override exists yet (agenticlens integration is
      # still a placeholder module), so a plain `uv sync` resolves cleanly
      # without needing --frozen or a sibling checkout.
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra langgraph --python ${{ matrix.python-version }}

      - name: Lint (ruff check)
        run: uv run ruff check src tests scripts examples

      # Scoped to src/tests, not "." -- ruff >=0.16 formats fenced ```python
      # blocks inside Markdown by default, and this repo's docs (README.md,
      # ROADMAP.md, concept.md) intentionally use abbreviated pseudocode
      # in those fences that isn't meant to be reformatted as real source.
      - name: Format check (ruff format)
        run: uv run ruff format --check src tests scripts examples

      - name: Type check (mypy)
        run: uv run mypy

      - name: Test (pytest, including real LangGraph dispatch)
        run: uv run pytest

      - name: Run offline examples and validate documentation snippets
        run: |
          for example in examples/*.py; do uv run python "$example"; done
          uv run python scripts/check_docs.py
          uv run python scripts/intent_benchmark.py
          uv run python scripts/validate_release.py

  package:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra langgraph --python 3.12
      - name: Build distributions
        run: |
          uv run python -m build
          uv run python -m twine check dist/*
          uv run python scripts/validate_release.py --dist dist

  sdk-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: Install native SDKs
        run: uv sync --locked --python 3.12 --extra dev --extra langgraph --extra autogen --extra crewai --extra openai-agents --extra google-adk --extra mcp
      - name: Native dispatch, approvals, failure policies and protected gateway
        run: |
          uv run pytest tests/test_adapter_conformance.py tests/test_autogen_adapter.py tests/test_mcp_gateway.py tests/test_scopes.py --junitxml=sdk-results.xml
          uv run python -c "import xml.etree.ElementTree as ET; assert all(int(s.get('skipped', 0)) == 0 for s in ET.parse('sdk-results.xml').iter('testsuite'))"
          uv run python examples/v0_8_framework_agents.py

  ecosystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: sidecar
      - uses: actions/checkout@v7
        with:
          repository: DeepAgentLabs/agenticlens
          path: lens
      - uses: actions/checkout@v7
        with:
          repository: DeepAgentLabs/agentic-chaos
          path: chaos
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.12
      - working-directory: sidecar
        run: |
          uv sync --locked --python 3.12 --extra dev
          uv pip install --python .venv/bin/python ../lens ../chaos
          uv run --no-sync pytest tests/test_ecosystem_exports.py
