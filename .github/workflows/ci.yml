name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # No [tool.uv.sources] override exists yet (agenticlens integration is
      # still a placeholder module), so a plain `uv sync` resolves cleanly
      # without needing --frozen or a sibling checkout.
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra langgraph --python ${{ matrix.python-version }}

      - name: Lint (ruff check)
        run: uv run ruff check src tests scripts examples

      # Scoped to src/tests, not "." -- ruff >=0.16 formats fenced ```python
      # blocks inside Markdown by default, and this repo's docs (README.md,
      # ROADMAP.md, concept.md) intentionally use abbreviated pseudocode
      # in those fences that isn't meant to be reformatted as real source.
      - name: Format check (ruff format)
        run: uv run ruff format --check src tests scripts examples

      - name: Type check (mypy)
        run: uv run mypy

      - name: Test (pytest, including real LangGraph dispatch)
        run: uv run pytest

      - name: Run offline examples and validate documentation snippets
        run: |
          for example in examples/*.py; do uv run python "$example"; done
          uv run python scripts/check_docs.py
          uv run python scripts/intent_benchmark.py
          uv run python scripts/validate_release.py

  package:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra langgraph --python 3.12
      - name: Build distributions
        run: |
          uv run python -m build
          uv run python -m twine check dist/*
          uv run python scripts/validate_release.py --dist dist

  # TODO(v0.1+, once agentic_sidecar.integrations.agenticlens has real code):
  # add a test-agenticlens-integration job that checks out a sibling
  # `agenticlens` repo and runs `uv sync --extra dev --extra agenticlens`
  # against it. Not added yet -- there's nothing in that module to exercise.
