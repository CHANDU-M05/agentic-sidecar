name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install docs dependencies
        run: uv sync --locked --extra docs --python 3.12

      - name: Validate Python snippets and local documentation links
        run: uv run python scripts/check_docs.py

      - name: Build docs
        run: uv run mkdocs build --strict -f website/mkdocs.yml --site-dir "$GITHUB_WORKSPACE/site/docs"

      - name: Build use cases
        run: uv run mkdocs build --strict -f website/mkdocs.usecases.yml --site-dir "$GITHUB_WORKSPACE/site/usecases"

      - name: Add product website
        run: |
          cp website/index.html site/index.html
          cp website/site.css site/site.css
          cp website/site.js site/site.js
          cp website/og.png site/og.png
          touch site/.nojekyll

      - name: Check site layout
        run: |
          test -f site/index.html
          test -f site/docs/index.html
          test -f site/usecases/index.html
          test -f site/usecases/assets/stylesheets/extra.css

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
