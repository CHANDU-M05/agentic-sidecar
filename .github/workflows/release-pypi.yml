name: publish-pypi

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release ref and source metadata
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_REF_TYPE" = tag
          python scripts/validate_release.py --tag "$RELEASE_TAG"
      - name: Install validation dependencies
        run: uv sync --locked --extra dev --extra langgraph --extra docs --python 3.12
      - name: Validate release behavior and docs
        run: |
          uv run ruff check src tests scripts examples
          uv run ruff format --check src tests scripts examples
          uv run mypy
          uv run pytest
          for example in examples/*.py; do uv run python "$example"; done
          uv run python scripts/check_docs.py
          uv run mkdocs build --strict
      - name: Build distributions
        run: |
          uv run python -m build
          uv run python -m twine check dist/*
          uv run python scripts/validate_release.py --dist dist
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-pypi:
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC) -- no API token/secret needed
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  create-github-release:
    runs-on: ubuntu-latest
    needs: publish-pypi
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog section
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()

          start = None
          end = None
          heading = f"## [{version}] - "
          for index, line in enumerate(changelog):
              if line.startswith(heading):
                  start = index
                  continue
              if start is not None and line.startswith("## "):
                  end = index
                  break

          if start is None:
              raise SystemExit(
                  f"Could not find CHANGELOG.md section for version {version}."
              )

          if end is None:
              end = len(changelog)

          section = "\n".join(changelog[start:end]).strip() + "\n"
          Path("release-notes.md").write_text(section, encoding="utf-8")
          PY
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: false
