site_name: Agentic Sidecar Documentation
site_url: https://deepagentlabs.io/agentic-sidecar/docs/
repo_url: https://github.com/DeepAgentLabs/agentic-sidecar
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: custom
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - assets/stylesheets/extra.css

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - Features: features.md
  - Configuration: configuration.md
  - API reference: api-reference.md
  - CLI reference: cli-reference.md
  - Integrations: integrations.md
  - Examples: examples.md
  - Troubleshooting: troubleshooting.md
  - Limitations: limitations.md
  - Roadmap: roadmap.md
