[build-system]
requires = ["hatchling>=1.20.0,<1.22.0"]
build-backend = "hatchling.build"

[project]
name = "agentic-sidecar"
version = "0.6.0"
description = "Companion intelligence and real-time decision supervision for autonomous AI agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "agentic-sidecar Contributors" }]
keywords = ["llm", "agents", "governance", "intent", "decision-supervision", "safety"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
# v0.5 CLI uses typer/rich for formatted output and command framework
dependencies = [
  "pydantic>=2.0,<3",
  # gate.policy / gate.risk load their rule sets from YAML (v0.1).
  "pyyaml>=6.0,<7",
  # v0.5 CLI for status command with Rich terminal formatting
  "typer>=0.9,<1",
  "rich>=13.0,<14",
]

[project.optional-dependencies]
# Only needed for agentic_sidecar.integrations.agenticlens -- the core
# runtime never requires it. That module is currently a placeholder (see
# src/agentic_sidecar/integrations/agenticlens.py); this extra is declared
# ahead of time so the dependency boundary is visible from the start.
agenticlens = [
  "agenticlens>=0.1.3",
]
# Only needed for agentic_sidecar.integrations.agentic_chaos -- also a
# placeholder (see src/agentic_sidecar/integrations/agentic_chaos.py). No
# specific floor is known yet since the integration surface itself isn't
# designed -- see ROADMAP.md's Cross-Project Dependencies ("agentic-chaos").
agentic-chaos = [
  "agentic-chaos>=0.1",
]
# Only needed to run the LangGraph example in examples/ or to build a real
# graph around agentic_sidecar.adapters.langgraph.attach()'s wrapped tools --
# the adapter module itself has no import-time dependency on `langgraph`
# (see src/agentic_sidecar/adapters/langgraph.py).
langgraph = [
  "langchain-core>=0.3,<2",
  "langgraph>=1.0,<2",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "build>=1.2",
  "twine>=5.1",
  "types-PyYAML>=6.0",
]
docs = [
  "mkdocs-material>=9.0",
]

[project.scripts]
agentic-sidecar = "agentic_sidecar.cli.main:main"

[project.urls]
Homepage = "https://github.com/DeepAgentLabs/agentic-sidecar"
Repository = "https://github.com/DeepAgentLabs/agentic-sidecar"
Issues = "https://github.com/DeepAgentLabs/agentic-sidecar/issues"
Changelog = "https://github.com/DeepAgentLabs/agentic-sidecar/blob/main/CHANGELOG.md"

[tool.hatch.build]
# Ensure we generate stable metadata version 2.4 for CI compatibility
# This avoids issues with older twine versions in CI that don't recognize 2.5

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_sidecar"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["agentic_sidecar"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["agentic_sidecar"]
mypy_path = "src"

[[tool.mypy.overrides]]
# agenticlens is optional -- don't require it installed for `mypy` to pass.
module = "agenticlens.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# agentic_chaos is optional -- don't require it installed for `mypy` to pass.
module = "agentic_chaos.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --cov=agentic_sidecar --cov-report=term-missing"

[tool.coverage.run]
source = ["src/agentic_sidecar"]
