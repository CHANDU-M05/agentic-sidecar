site_name: Agentic Sidecar Documentation
site_url: https://deepagentlabs.io/agentic-sidecar/docs/
repo_url: https://github.com/DeepAgentLabs/agentic-sidecar
edit_uri: edit/main/website/docs/
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: slate
      primary: custom
      accent: custom
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - Features: features.md
  - Live operations: live-operations.md
  - Governance & evaluators: governance.md
  - Configuration: configuration.md
  - API reference: api-reference.md
  - CLI reference: cli-reference.md
  - Scoped supervision: scoped-supervision.md
  - Integrations: integrations.md
  - Tower 0.6 recovery: control-tower-0.6.md
  - Examples: examples.md
  - Use cases: https://deepagentlabs.io/agentic-sidecar/usecases/
  - Troubleshooting: troubleshooting.md
  - Limitations: limitations.md
  - Roadmap: roadmap.md
